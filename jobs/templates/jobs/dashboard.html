<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - JobGuard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #1769e0;
            color: white;
            padding: 20px 50px;
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            margin-top: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .number {
            font-size: 35px;
            font-weight: bold;
            color: #1769e0;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #1769e0;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="navbar">
    🛡️ JobGuard
</div>

<div class="container">

    <h1>Welcome, {{ user.username }} 👋</h1>

    <div class="card">
        <h2>Total Jobs</h2>
        <div class="number">{{ total_jobs }}</div>
    </div>

    <div class="card">
        <h2>Verified Jobs 🛡️</h2>
        <div class="number">{{ verified_count }}</div>
    </div>

    <a href="/jobs/">Browse Jobs →</a>

</div>

</body>
</html>
